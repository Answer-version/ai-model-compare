<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" rx="20"/>

  <!-- Grid pattern -->
  <g opacity="0.1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#fff" stroke-width="1"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)"/>
  </g>

  <!-- Glowing orb -->
  <circle cx="900" cy="315" r="200" fill="url(#accent)" opacity="0.15"/>
  <circle cx="900" cy="315" r="150" fill="url(#accent)" opacity="0.1"/>

  <!-- Logo emoji -->
  <circle cx="150" cy="315" r="60" fill="#3b82f6" opacity="0.2"/>
  <text x="150" y="340" font-size="70" text-anchor="middle">🤖</text>

  <!-- Title -->
  <text x="250" y="280" font-family="system-ui, sans-serif" font-size="56" font-weight="bold" fill="#fff">
    AI Models Comparison
  </text>

  <!-- Subtitle -->
  <text x="250" y="340" font-family="system-ui, sans-serif" font-size="28" fill="#94a3b8">
    32+ AI Models | Subscription Plans &amp; API Pricing
  </text>

  <!-- Divider line -->
  <rect x="250" y="370" width="700" height="3" fill="url(#accent)" rx="2"/>

  <!-- Features -->
  <g font-family="system-ui, sans-serif" font-size="22" fill="#e2e8f0">
    <text x="250" y="420">📊 Compare subscription plans side by side</text>
    <text x="250" y="460">💰 Track API pricing in real-time</text>
    <text x="250" y="500">🔍 Filter by region, capability &amp; billing type</text>
  </g>

  <!-- CTA Button -->
  <rect x="250" y="530" width="200" height="50" fill="url(#accent)" rx="10"/>
  <text x="350" y="562" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">
    🌐 Visit Now
  </text>

  <!-- Model logos row -->
  <g opacity="0.6">
    <text x="600" y="560" font-size="32">🧠</text>
    <text x="660" y="560" font-size="32">🤖</text>
    <text x="720" y="560" font-size="32">💎</text>
    <text x="780" y="560" font-size="32">🧩</text>
    <text x="840" y="560" font-size="32">🔍</text>
    <text x="900" y="560" font-size="32">🚢</text>
    <text x="960" y="560" font-size="32">🌙</text>
    <text x="1020" y="560" font-size="32">🦙</text>
  </g>

  <!-- URL -->
  <text x="600" y="600" font-family="system-ui, sans-serif" font-size="20" fill="#64748b" text-anchor="middle">
    ai-model-compare.us.ci
  </text>
</svg>